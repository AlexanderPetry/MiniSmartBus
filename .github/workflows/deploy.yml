name: Reinstall and restart on Pi

on:
  push:
    branches:
      - main

jobs:
  reinstall:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Show where the repo was checked out
        run: |
          echo "Repo checked out to: $GITHUB_WORKSPACE"
          pwd
          ls -la
          ls -la "${{ github.workspace }}/software/RaspberryPi" || true

      - name: Make scripts executable
        run: |
          chmod +x "${{ github.workspace }}/software/install.sh" || true
          chmod +x "${{ github.workspace }}/software/uninstall.sh" || true
          chmod +x "${{ github.workspace }}/software/restart.sh" || true

      - name: Uninstall old services
        run: |
          sudo bash "${{ github.workspace }}/software/uninstall.sh"

      - name: Install fresh services
        run: |
          sudo bash "${{ github.workspace }}/software/install.sh"

      - name: Restart all services
        run: |
          sudo bash "${{ github.workspace }}/software/restart.sh"