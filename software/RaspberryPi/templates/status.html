<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
            margin: 0;
            padding: 0;
        }

        .topbar {
            background: #0f172a;
            border-bottom: 1px solid #374151;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .topbar-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f9fafb;
        }

        .menu-toggle {
            display: none;
            background: #1f2937;
            color: #f9fafb;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 0.75rem;
        }

        .nav-link {
            color: #cbd5e1;
            text-decoration: none;
            padding: 0.45rem 0.8rem;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .nav-link:hover {
            background: #1f2937;
            color: #ffffff;
        }

        .nav-link.active {
            background: #2563eb;
            color: #ffffff;
        }

        .page-wrap {
            padding: 2rem 1rem;
        }

        .card {
            max-width: 700px;
            margin: 2rem auto;
            background: #1f2937;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem 0.5rem;
            text-align: left;
            border-bottom: 1px solid #374151;
            vertical-align: top;
        }

        th {
            color: #9ca3af;
            font-weight: bold;
        }

        .status-ok {
            color: #22c55e;
            font-weight: bold;
        }

        .status-failed {
            color: #ef4444;
            font-weight: bold;
        }

        .status-unknown {
            color: #fbbf24;
            font-weight: bold;
        }

        .expand-btn {
            background: #2d3748;
            border: 1px solid #374151;
            color: #cbd5e1;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            margin-left: 0.5rem;
            font-size: 0.875rem;
        }

        .expand-btn:hover {
            background: #374151;
            color: #ffffff;
        }

        .expanded-log {
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 0.75rem;
            margin-top: 0.75rem;
            max-height: 240px;
            overflow-y: auto;
            display: none;
            color: #e5e7eb;
        }

        @media (max-width: 700px) {
            .menu-toggle {
                display: inline-block;
            }

            .topbar-inner {
                flex-wrap: wrap;
            }

            .nav-links {
                width: 100%;
                display: none;
                flex-direction: column;
                padding-top: 0.5rem;
            }

            .nav-links.open {
                display: flex;
            }

            .nav-link {
                width: 100%;
                box-sizing: border-box;
            }

            table, thead, tbody, th, td, tr {
                display: block;
            }

            thead {
                display: none;
            }

            tr {
                border-bottom: 1px solid #374151;
                padding: 0.75rem 0;
            }

            td {
                border: none;
                padding: 0.35rem 0;
            }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <div class="brand">Mini Smart Bus</div>

            <button class="menu-toggle" type="button" onclick="toggleMenu()">
                Menu
            </button>

            <nav id="main-nav" class="nav-links">
                <a href="/" class="nav-link">Live Position</a>
                <a href="/status" class="nav-link active">Service Status</a>
            </nav>
        </div>
    </div>

    <div class="page-wrap">
        <div class="card">
            <h1>Service Status</h1>
            <table>
                <thead>
                    <tr>
                        <th>Service</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for svc in services %}
                    <tr>
                        <td>
                            {{ svc.name }}
                            {% if svc.error_log %}
                            <button
                                class="expand-btn"
                                type="button"
                                onclick="toggleExpand('{{ svc.name | replace('.', '__') }}')"
                            >
                                Details
                            </button>
                            {% endif %}
                        </td>
                        <td>
                            <div
                                class="
                                    {% if svc.status == 'active' %}
                                        status-ok
                                    {% elif svc.status == 'failed' %}
                                        status-failed
                                    {% else %}
                                        status-unknown
                                    {% endif %}
                                "
                            >
                                {{ svc.status }}
                            </div>

                            {% if svc.error_log %}
                            <div id="log-{{ svc.name | replace('.', '__') }}" class="expanded-log">
{{ svc.error_log }}
                            </div>
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('main-nav');
            nav.classList.toggle('open');
        }

        function toggleExpand(id) {
            const el = document.getElementById('log-' + id);
            if (!el) return;

            if (el.style.display === 'block') {
                el.style.display = 'none';
            } else {
                el.style.display = 'block';
            }
        }
    </script>
</body>
</html>
