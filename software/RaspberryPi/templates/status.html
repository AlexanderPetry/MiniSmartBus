<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
            margin: 0;
            padding: 2rem;
        }
        .card {
            max-width: 640px;
            margin: 2rem auto;
            background: #1f2937;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 0.5rem;
            text-align: left;
            border-bottom: 1px solid #374151;
        }
        th {
            color: #9ca3af;
            font-weight: bold;
        }
        .status-ok {
            color: #22c55e;
        }
        .status-failed {
            color: #ef4444;
        }
        .status-unknown {
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Service Status</h1>
        <table>
            <thead>
                <tr>
                    <th>Service</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for svc in services %}
                    <tr>
                        <td>{{ svc.name }}</td>
                        <td
                            class="
                                {% if svc.status == 'active' %}
                                    status-ok
                                {% elif svc.status == 'failed' %}
                                    status-failed
                                {% else %}
                                    status-unknown
                                {% endif %}
                            "
                        >
                            {{ svc.status }}
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
